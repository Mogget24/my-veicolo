packages:
  - apps/*
  - packages/*

# Fail instead of silently excluding packages younger than minimumReleaseAge (1 day).
minimumReleaseAgeStrict: true

allowBuilds:
  esbuild: true

# Single source of truth for dependency versions.
# Packages reference these with "name": "catalog:".
catalog:
  # Tooling
  turbo: ^2.11.11
  typescript: ^7.0.2
  vitest: ^5.1.0
  tsx: ^4.23.15
  tsdown: ^0.23.7
  '@types/node': ^26.6.6

  # Shared runtime
  zod: ^4.3.5
  hono: ^4.13.18
  better-auth: ^1.7.24

  # Database
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  '@neondatabase/serverless': ^1.2.1
  '@electric-sql/pglite': ^0.5.16

  # API
  '@hono/node-server': ^2.1.8
  '@hono/zod-validator': ^0.9.1
  web-push: ^4.0.0
  '@types/web-push': ^3.6.4

  # Web
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@tanstack/react-query': ^5.107.1
  '@tanstack/react-router': ^1.170.46
  '@tanstack/react-form': ^1.33.5
  '@tanstack/router-plugin': ^1.169.0
  vite: ^8.3.8
  '@vitejs/plugin-react': ^6.3.0
  tailwindcss: ^4.3.5
  '@tailwindcss/vite': ^4.3.5
  vite-plugin-pwa: ^2.0.0
  '@vite-pwa/assets-generator': ^2.0.0
  sharp: ^0.35.5
  workbox-build: ^7.4.1
  workbox-core: ^7.4.1
  workbox-precaching: ^7.4.1
  workbox-routing: ^7.4.1
  workbox-window: ^7.4.1
